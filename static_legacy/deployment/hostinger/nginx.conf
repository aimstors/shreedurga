# /etc/nginx/sites-available/shreedurgainterior.in
# Nginx config for Shree Durga Interior
# Works on: AWS EC2, Hostinger VPS, any Ubuntu/Debian VPS

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name shreedurgainterior.in www.shreedurgainterior.in;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name shreedurgainterior.in www.shreedurgainterior.in;

    # SSL certs (auto-configured by Certbot)
    ssl_certificate     /etc/letsencrypt/live/shreedurgainterior.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shreedurgainterior.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Frontend static root
    root /var/www/shreedurga-interior/frontend;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Cache static assets aggressively
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # HTML pages — short cache
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # API proxy → Node.js backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_cache_bypass $http_upgrade;

        # CORS for API
        add_header 'Access-Control-Allow-Origin' 'https://shreedurgainterior.in' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, x-api-key' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # SPA / page routing
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Security headers
    add_header X-Frame-Options            "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # Block common exploits
    location ~ /\.ht       { deny all; }
    location ~ /\.env      { deny all; }
    location ~ /\.git      { deny all; }
    location ~ package\.json { deny all; }

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    location /api/contact {
        limit_req zone=api burst=3 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logging
    access_log /var/log/nginx/shreedurga_access.log;
    error_log  /var/log/nginx/shreedurga_error.log;
}
