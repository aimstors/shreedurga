name: Deploy Shree Durga Interior

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── TEST ──
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Syntax check
        run: node --check backend/server.js

      - name: Run tests
        run: cd backend && npm test --if-present
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ── DEPLOY TO VERCEL ──
  deploy-vercel:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  # ── DEPLOY TO VPS (Hostinger / AWS EC2) ──
  deploy-vps:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment..."
            cd /var/www/shreedurga-interior
            git pull origin main
            cd backend
            npm install --production --silent
            pm2 reload shreedurga-api --update-env
            pm2 save
            echo "✅ Deployment complete!"
            echo "📊 Status:"
            pm2 status shreedurga-api

  # ── NOTIFY ──
  notify:
    name: Notify on completion
    needs: [deploy-vercel, deploy-vps]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          if [ "${{ needs.deploy-vercel.result }}" == "success" ]; then
            echo "✅ Vercel deployment: SUCCESS"
          else
            echo "❌ Vercel deployment: ${{ needs.deploy-vercel.result }}"
          fi
          if [ "${{ needs.deploy-vps.result }}" == "success" ]; then
            echo "✅ VPS deployment: SUCCESS"
          else
            echo "❌ VPS deployment: ${{ needs.deploy-vps.result }}"
          fi
